<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prática de CSS Grid - 3 Colunas</title>
  <style>
    /* * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f9;
    } */

    /* Container Principal com CSS Grid */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr; /* Três colunas de largura igual */
      gap: 20px; 
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background-color: #2ecc71;
      color: white;
      padding: 40px 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">Bloco 1</div>
    <div class="card">Bloco 2</div>
    <div class="card">Bloco 3</div>
    <div class="card">Bloco 4</div>
    <div class="card">Bloco 5</div>
    <div class="card">Bloco 6</div>
  </div>

</body>
</html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplos de Tabelas</h1>


    <table border="1">
        <caption>Exemplo de Tabela</caption>

        <thead>
            <tr>
                <th>Coluna 1</th>
                <th>Coluna 2</th>
                <th>Coluna 3</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Item 1</td>
                <td>Item 2</td>
                <td>Item 3</td>
            </tr>
            <tr>
                <td>Item 4</td>
                <td>Item 5</td>
                <td>Item 6</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Rodapé da tabela</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
